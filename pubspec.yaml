name: closwap
description: MZ세대 의류 스왑 서비스 MVP
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 🔥 디자인 소스 필수 패키지 (정상 들여쓰기)
  flutter_screenutil: ^5.9.3
  carousel_slider: ^5.0.0

  # UI 및 유틸리티 (기존 디자인 유지)
  cupertino_icons: ^1.0.6
  flutter_card_swiper: ^7.0.0
  image_picker: ^1.2.1
  lottie: ^3.3.2
  shared_preferences: ^2.5.4
  appinio_swiper: ^2.1.1
  curved_navigation_bar: ^1.0.6

  # 지도 및 위치 (기존 유지)
  google_maps_flutter: ^2.14.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # 🔥 Supabase 패키지 (핵심 서비스)
  supabase_flutter: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/