name: closwap
description: MZ세대 의류 스왑 서비스 MVP
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI 및 유틸리티 (기존 디자인 유지)
  cupertino_icons: ^1.0.6
  flutter_card_swiper: ^7.0.0
  image_picker: ^1.2.1
  lottie: ^3.3.2
  shared_preferences: ^2.5.4
  appinio_swiper: ^2.1.1
  curved_navigation_bar: ^1.0.6

  # 지도 및 위치 (기존 유지)
  google_maps_flutter: ^2.14.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # 🔥 Supabase 패키지 (Firebase 대체 핵심)
  supabase_flutter: ^2.6.0  # 최신 안정화 버전

  # ❌ Firebase 관련 패키지들은 모두 삭제되었습니다.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/animations/
  #   - assets/images/