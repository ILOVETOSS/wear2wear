name: closwap
description: MZ세대 의류 스왑 서비스 MVP
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI 및 유틸리티
  cupertino_icons: ^1.0.6
  flutter_card_swiper: ^7.0.0
  image_picker: ^1.2.1
  lottie: ^3.3.2
  shared_preferences: ^2.5.4
  appinio_swiper: ^2.1.1

  # 지도 및 위치 (선택 사항)
  google_maps_flutter: ^2.14.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # 🔥 Firebase 핵심 패키지 (버전 호환성 맞춤)
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  firebase_storage: ^13.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # 로티 애니메이션이나 이미지를 쓰신다면 아래 assets 설정을 활성화하세요.
  # assets:
  #   - assets/animations/
  #   - assets/images/